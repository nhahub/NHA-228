name: nha_228
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  carousel_slider: ^5.1.1
  cloud_firestore: ^6.0.3
  cupertino_icons: ^1.0.8
  dropdown_button2: ^2.3.9
  firebase_auth: ^6.1.1
  firebase_core: ^4.2.0
  firebase_storage: 13.0.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  go_router: ^16.2.4
  hive_ce: ^2.14.0
  hive_ce_flutter: ^2.3.2
  http: ^1.5.0
  image_picker: ^1.2.0
  intl: ^0.20.2
  meta: ^1.15.0
  shimmer: ^3.0.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.9.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: otama.ep
      fonts:
        - asset: assets/fonts/Otama-ep.otf

# -------------------------
# flutter_launcher_icons configuration
# Must be a top-level key named `flutter_icons`
# -------------------------
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
